[package]
name = "secumon-windows-files"
version = "0.1.0"
edition = "2024"
publish = false
description = "Experimental, independent Windows setup publication boundary"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_WindowsProgramming"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "=0.2.189"

[build-dependencies]
napi-build = "2"

[profile.release]
panic = "unwind"
lto = true

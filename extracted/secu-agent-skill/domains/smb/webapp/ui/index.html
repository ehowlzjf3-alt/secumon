<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SMB E2E 파이프라인</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#090c0d; --band:#111513; --panel:#151b19; --panel-2:#1c2421;
      --line:#2f3b36; --line-2:#445049; --muted:#94a49e; --text:#edf5f1; --soft:#cbd7d2;
      --accent:#36c2a0; --accent-2:#7bbef0; --warn:#d8a548; --bad:#e56b75; --ok:#7dd68a;
      --shadow:0 12px 28px rgba(0,0,0,.22);
      font-family:Inter,ui-sans-serif,system-ui,"Segoe UI","Malgun Gothic",sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-size:14px}
    header{height:60px;background:var(--band);border-bottom:1px solid var(--line);padding:0 20px;
      display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
    header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
    header .sp{flex:1}
    nav{display:flex;gap:8px;flex-wrap:wrap}
    nav button{background:transparent;border:1px solid var(--line);color:var(--soft);
      min-height:34px;padding:7px 14px;border-radius:8px;cursor:pointer}
    nav button.active{background:var(--accent);border-color:var(--accent);color:#03110e;font-weight:700}
    main{padding:20px;max-width:1840px;margin:0 auto}
    h2{font-size:18px;margin:22px 0 12px}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:22px 0 12px}
    .section-head h2{margin:0}
    .section-head .muted{font-size:12px}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
    th{color:var(--muted);font-weight:600}
    input,select{background:var(--panel-2);border:1px solid var(--line);color:var(--text);
      padding:6px 8px;border-radius:6px}
    .muted{color:var(--muted)}
    .row{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
    .card h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:700}
    .card .big{font-size:28px;font-weight:800;letter-spacing:0;line-height:1.15}
    .pill{display:inline-flex;align-items:center;justify-content:center;min-height:20px;
      padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line);white-space:nowrap}
    .pill.alive{color:var(--ok);border-color:rgba(125,214,138,.7)}
    .pill.dead{color:var(--bad);border-color:rgba(229,107,117,.75)}
    .pill.warn{color:var(--warn);border-color:rgba(217,164,65,.75)}
    .sev-critical{color:var(--bad)} .sev-high{color:var(--warn)} .sev-medium{color:var(--accent-2)}
    button.act{background:var(--panel-2);border:1px solid var(--line);color:var(--text);
      min-height:32px;padding:6px 12px;border-radius:8px;cursor:pointer}
    button.act:hover{border-color:var(--accent)}
    .toggle{cursor:pointer}

    .agent-workbench{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(0,1.6fr);gap:12px;margin-bottom:14px}
    .operator-console,.worker-console{background:var(--panel);border:1px solid var(--line);border-radius:8px;
      box-shadow:var(--shadow);min-width:0;overflow:hidden}
    .console-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
    .console-title{font-weight:850;font-size:14px}
    .console-sub{color:var(--muted);font-size:11px;font-family:ui-monospace,monospace}
    .console-feed{display:flex;flex-direction:column;gap:8px;padding:12px;max-height:318px;overflow:auto}
    .console-line{display:grid;grid-template-columns:78px minmax(0,1fr);gap:9px;align-items:start}
    .role-badge{display:inline-flex;align-items:center;justify-content:center;min-height:24px;border:1px solid var(--line);
      border-radius:999px;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800}
    .console-text{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;
      color:var(--soft);line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
    .worker-console{display:grid;grid-template-columns:320px minmax(0,1fr)}
    .worker-list{border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
    .worker-list .fanout-list{padding:10px;max-height:362px;overflow:auto}
    .worker-transcript{min-width:0;display:grid;grid-template-rows:auto 1fr}
    .chat-empty{padding:20px;color:var(--muted);line-height:1.5}
    .agent-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
    .agent-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0;
      display:grid;grid-template-rows:auto auto 1fr;box-shadow:var(--shadow)}
    .agent-head{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:12px 12px 8px;
      border-bottom:1px solid var(--line)}
    .agent-title{font-weight:800;font-size:14px;min-width:0}
    .agent-state{display:flex;gap:6px;align-items:center;justify-content:flex-end}
    .agent-main{padding:9px 12px;color:var(--soft);border-bottom:1px solid var(--line);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:anywhere;
      font-family:ui-monospace,monospace;font-size:12px}
    .fanout-list{display:flex;flex-direction:column;gap:6px;padding:10px 12px;min-height:132px}
    .fanout-item{width:100%;display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:8px;align-items:center;
      background:var(--panel-2);border:1px solid transparent;border-radius:7px;color:var(--text);
      padding:8px 9px;text-align:left;cursor:pointer}
    .fanout-item:hover,.fanout-item.active{border-color:var(--accent)}
    .fanout-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
    .fanout-dot.active{background:var(--ok);box-shadow:0 0 8px rgba(125,214,138,.9)}
    .fanout-dot.queued,.fanout-dot.reported,.fanout-dot.reply_received,.fanout-dot.partially_remediated,
    .fanout-dot.exception_review,.fanout-dot.owner_update_needed,.fanout-dot.owner_reassignment_review,
    .fanout-dot.reassigned{background:var(--warn)}
    .fanout-dot.finding,.fanout-dot.re_requested,.fanout-dot.escalated{background:var(--bad)}
    .fanout-name{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .fanout-sub{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
    .fanout-age{font-size:11px;color:var(--muted);white-space:nowrap}
    .chat-panel{display:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:0 0 18px;
      box-shadow:var(--shadow)}
    .chat-panel.open{display:block}
    .chat-panel.embedded{display:grid;margin:0;border:0;border-radius:0;box-shadow:none;background:transparent;min-height:100%;
      grid-template-rows:auto 1fr}
    .chat-head{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
    .chat-head b{font-size:14px}
    .chat-head button{margin-left:auto}
    .chat-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
    .chat-meta .pill{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .chat-meta .pill.path{max-width:360px;font-family:ui-monospace,monospace}
    .chat-body{padding:12px;display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto}
    .chat-panel.embedded .chat-body{max-height:318px}
    .session-context{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:2px}
    .session-context div{background:rgba(28,36,33,.72);border:1px solid var(--line);border-radius:7px;padding:8px;min-width:0}
    .session-context small{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;margin-bottom:3px}
    .session-context strong{display:block;color:var(--text);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .session-context strong.path{font-family:ui-monospace,monospace}
    .msg{display:grid;grid-template-columns:82px minmax(0,1fr);gap:10px;align-items:start}
    .msg-role{color:var(--muted);font-size:11px;text-transform:uppercase;padding-top:7px}
    .msg-text{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:9px 10px;
      white-space:pre-wrap;line-height:1.45;overflow-wrap:anywhere}

    .pipeline-board{position:relative;width:min(100%,1440px);margin:12px auto 0}
    .pipe-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;align-items:stretch}
    .flow-card{--flow-main-h:168px;--flow-metric-h:96px;position:relative;width:100%;min-width:0;min-height:350px;
      background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px;
      display:grid;grid-template-rows:38px var(--flow-main-h) var(--flow-metric-h);row-gap:10px;box-shadow:var(--shadow)}
    .flow-card.live{border-color:rgba(125,214,138,.9);box-shadow:0 0 0 1px rgba(125,214,138,.45) inset,var(--shadow)}
    .flow-card.down{border-color:rgba(229,107,117,.7)}
    .flow-head{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;min-height:34px}
    .flow-title{display:flex;gap:6px;align-items:flex-start;font-weight:800;font-size:12px;line-height:1.28;min-width:0}
    .flow-title-text{overflow-wrap:anywhere}
    .proc-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex:0 0 8px;background:var(--bad)}
    .proc-dot.live{background:var(--ok);box-shadow:0 0 8px rgba(125,214,138,.9)}
    .power-toggle{min-width:48px;height:26px;border-radius:999px;border:1px solid var(--line);
      background:var(--panel-2);color:var(--muted);font-size:11px;font-weight:800;cursor:pointer}
    .power-toggle.on{color:#062015;background:var(--ok);border-color:var(--ok)}
    .power-toggle.off{color:var(--bad);border-color:rgba(229,107,117,.8)}
    .flow-main{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px;height:var(--flow-main-h);min-height:var(--flow-main-h)}
    .stat-stack{display:grid;grid-template-rows:repeat(3,1fr);gap:6px;height:100%;min-height:0}
    .stat-box{background:var(--panel-2);border:1px solid transparent;border-radius:7px;padding:6px 4px;text-align:center;
      display:flex;flex-direction:column;justify-content:center;min-width:0}
    .stat-box .n{font-size:17px;font-weight:900;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .stat-box .l{font-size:10px;color:var(--muted);margin-top:2px}
    .stat-box.queue .n{color:var(--warn)} .stat-box.proc .n{color:var(--accent-2)} .stat-box.done .n{color:var(--ok)}
    .target-list{justify-self:stretch;width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;height:100%;min-height:0;
      display:grid;grid-template-rows:26px 1fr;overflow:hidden}
    .target-head{display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--line);color:var(--muted);
      font-size:10px;font-weight:800}
    .target-body{padding:5px 7px;overflow:auto}
    .target-row{display:grid;grid-template-columns:10px minmax(0,1fr);gap:6px;align-items:center;
      min-height:24px;font-family:ui-monospace,monospace;font-size:12.5px;color:var(--soft)}
    .target-row.live{color:var(--ok)}
    .target-row.inspectable{cursor:zoom-in;border-radius:5px;padding-right:4px}
    .target-row.inspectable:hover{background:rgba(47,183,164,.12)}
    .target-row span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .target-mark{width:6px;height:6px;border-radius:50%;background:var(--muted)}
    .target-row.live .target-mark{background:var(--ok);box-shadow:0 0 6px rgba(125,214,138,.9)}
    .target-empty{font-size:11px;color:var(--muted);padding:5px 0}
    .metric-grid{align-self:stretch;align-content:start;display:grid;grid-template-columns:1fr;gap:3px;
      height:var(--flow-metric-h);border-top:1px dashed var(--line);padding-top:9px;overflow:hidden}
    .metric-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;color:var(--soft);font-size:12px;min-height:18px}
    .metric-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .metric-row b{color:var(--text);white-space:nowrap}
    .flow-card.arrow-r::after,.flow-card.arrow-l::after,.flow-card.arrow-d::after{content:"";position:absolute;background:var(--accent)}
    .flow-card.arrow-r::after{right:-24px;top:50%;width:18px;height:2px}
    .flow-card.arrow-r::before{content:"";position:absolute;right:-25px;top:calc(50% - 5px);width:10px;height:10px;
      border-top:2px solid var(--accent);border-right:2px solid var(--accent);transform:rotate(45deg)}
    .flow-card.arrow-l::after{left:-24px;top:50%;width:18px;height:2px}
    .flow-card.arrow-l::before{content:"";position:absolute;left:-25px;top:calc(50% - 5px);width:10px;height:10px;
      border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg)}
    .flow-card.arrow-d::after{left:50%;bottom:-24px;width:2px;height:18px}
    .flow-card.arrow-d::before{content:"";position:absolute;left:calc(50% - 5px);bottom:-25px;width:10px;height:10px;
      border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg)}
    .finding-toolbar{display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(3,minmax(130px,.7fr)) auto;
      gap:8px;align-items:end;margin:10px 0 12px}
    .finding-toolbar label{display:grid;gap:4px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}
    .finding-toolbar input,.finding-toolbar select{width:100%;min-height:34px}
    .finding-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0}
    .pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .pager button:disabled{opacity:.45;cursor:not-allowed}
    .report-table{table-layout:fixed}
    .report-table .asset-cell code{color:#d9edf7;word-break:break-all}
    .report-table .risk-cell{color:#d8e2e7;overflow-wrap:anywhere}
    .report-table tr.finding-row:hover{background:rgba(47,183,164,.08)}
    .report-table tr.selected{background:rgba(54,194,160,.12)}
    .report-layout{display:grid;grid-template-columns:minmax(300px,.48fr) minmax(0,1.9fr);gap:10px;align-items:stretch;
      height:var(--report-layout-h,calc(100vh - 250px));min-height:420px;max-height:calc(100vh - 96px);overflow:hidden}
    .report-list-card,.report-detail-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
      min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
    .report-list-card{display:flex;flex-direction:column;padding:8px}
    .report-detail-card{position:static;padding:10px;overflow-y:auto;overflow-x:hidden}
    .report-detail-card *{min-width:0}
    .report-detail-card code{white-space:normal;word-break:break-word;overflow-wrap:anywhere}
    .report-detail-card .smb-pill{max-width:100%;white-space:normal;overflow-wrap:anywhere;line-height:1.25}
    .report-detail-card .summary-access-grid span{white-space:normal}
    .report-detail-card .smb-report,.report-detail-card .smb-share-report,.report-detail-card .smb-pane,.report-detail-card .smb-finding-card{max-width:100%;overflow-wrap:anywhere}
    .report-thread-list{display:grid;gap:6px}
    .report-thread-row{width:100%;border:1px solid var(--line);background:#10171b;color:var(--text);border-radius:8px;
      padding:8px;text-align:left;cursor:pointer;display:grid;gap:5px;min-width:0}
    .report-thread-row:hover,.report-thread-row.selected{border-color:#2fb7a4;background:#12251f}
    .report-thread-main{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-width:0}
    .report-thread-title{display:grid;gap:2px;min-width:0}
    .report-thread-title code{font-size:12px;color:#d9edf7;overflow-wrap:anywhere}
    .report-thread-meta{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
    .report-thread-sub{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
    .report-mail-overview{border:1px solid var(--line);background:#0f1519;border-radius:8px;padding:10px;display:grid;gap:8px}
    .report-mail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .report-mail-grid>div{border:1px solid var(--line);border-radius:8px;padding:8px;background:#121a1f;min-width:0}
    .report-mail-grid small{display:block;color:var(--muted);font-size:10.5px}
    .report-mail-grid strong{display:block;color:var(--text);font-size:12.5px;overflow-wrap:anywhere}
    .report-mail-preview{display:grid;gap:8px}
    .report-mail-preview .event-html{width:100%;height:min(520px,62vh);min-height:320px;border:1px solid var(--line);border-radius:6px;background:#fff}
    .tag-row{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
    .smb-pill{display:inline-flex;align-items:center;min-height:20px;padding:1px 7px;border-radius:999px;
      border:1px solid #34414a;font-size:10.5px;color:#c8d7df;background:#141b20;white-space:nowrap}
    .smb-pill.access{border-color:#315c68;color:#bfe7ef;background:#102026}
    .smb-pill.exposure{border-color:#755c35;color:#f0d18f;background:#241d12}
    .smb-pill.signal{border-color:#5f5630;color:#e2ca78;background:#201d12}
    .smb-pill.error{border-color:#74434b;color:#f0adb4;background:#24161a}
    .smb-pill.review{border-color:#6b4f67;color:#debfe0;background:#211823}
    .smb-pill.meta{color:#9aa8b1;background:#11171b}
    .smb-pill.evidence-true{border-color:#287e63;color:#a7f0cc;background:#10231b}
    .smb-pill.evidence-false{border-color:#74434b;color:#f0adb4;background:#24161a}
    .smb-pill.evidence-unverified{border-color:#5d6570;color:#cfd7df;background:#171d23}
    .severity-high,.severity-critical{color:#ff9aa4}
    .severity-medium{color:#f1cf79}.severity-low{color:#9ed8ff}.severity-informational{color:#9fc8b8}
    .detail-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .detail-head .report-back{background:var(--panel-2);border:1px solid var(--line);color:var(--text);
      min-height:32px;padding:6px 12px;border-radius:8px;cursor:pointer}
    .detail-hero{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;
      display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;box-shadow:var(--shadow)}
    .detail-title{display:grid;gap:5px;min-width:0}
    .detail-title strong{font-size:18px;overflow-wrap:anywhere}
    .detail-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
    .smb-report{display:grid;gap:12px}
    .smb-report-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .smb-report-summary>div{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px;min-width:0}
    .smb-report-summary small{display:block;color:var(--muted);font-size:10.5px}
    .smb-report-summary strong{display:block;margin-top:2px;font-size:15px;color:var(--text)}
    .smb-report-summary .summary-note{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.35}
    .summary-access-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:7px}
    .summary-access-grid span{border:1px solid #34414a;border-radius:6px;background:#121a1f;padding:5px 4px;text-align:center;
      font-size:11px;color:#c8d7df;white-space:nowrap}
    .summary-access-grid b{display:block;color:#f0d18f;font-size:13px;margin-top:1px}
    .smb-share-report{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px;display:grid;gap:10px}
    .smb-share-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .smb-share-head h3{margin:0;font-size:15px}.smb-share-head code{color:#d9edf7;word-break:break-all}
    .smb-share-layout{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.18fr);gap:8px;align-items:stretch}
    .smb-pane{border:1px solid var(--line);border-radius:8px;background:#0f1519;min-height:240px;max-height:520px;overflow-y:auto;overflow-x:hidden;padding:8px}
    .smb-pane h3,.smb-report-card h3{margin:0 0 8px;font-size:13px;color:#d5e2e8}
    .smb-report-card{border:1px solid var(--line);border-radius:8px;background:#0f1519;padding:10px;display:grid;gap:8px}
    .smb-info-row{border-top:1px solid rgba(255,255,255,.08);padding-top:7px;display:grid;gap:4px}
    .smb-info-row:first-child{border-top:0;padding-top:0}.smb-info-row code{color:#e8d28f;overflow-wrap:anywhere}
    .smb-info-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.smb-info-title strong{font-size:12px;color:#e4edf2}
    .smb-info-text{font-size:12px;color:#c8d7df;line-height:1.45}
    .smb-action-list{margin:0;padding-left:18px;display:grid;gap:5px}
    .smb-action-list li{color:#d3e0e6;font-size:12px;line-height:1.45}
    .smb-risk-flags{display:flex;flex-wrap:wrap;gap:4px}
    .smb-hit-list{display:grid;gap:3px;margin-top:4px;color:#c8d7df}
    .smb-hit-list div{border-left:2px solid #5f5630;padding-left:6px}.smb-hit-list code{color:#e4cf8f}
    .smb-empty{color:var(--muted);font-size:11.5px;padding:4px 0}
    .smb-finding-list{display:grid;gap:8px}
    .smb-finding-card{border:1px solid #33414a;border-left:3px solid #c59b3a;background:#11171b;
      border-radius:7px;padding:9px;display:grid;gap:6px}
    .smb-finding-card code{color:#e8d28f;overflow-wrap:anywhere}
    .smb-file-head{display:grid;gap:2px}.smb-file-meta{color:#8797a0;font-size:10.5px}
    .smb-tree-panel{background:transparent;padding:0}
    .smb-tree{display:grid;gap:3px;font-size:12px}
    .smb-tree details{margin-left:0}.smb-tree summary{list-style:none;cursor:pointer}
    .smb-tree summary::-webkit-details-marker{display:none}
    .smb-tree-row{display:flex;align-items:flex-start;gap:8px;padding:4px 6px;border-radius:5px}
    .smb-tree-row:hover{background:rgba(255,255,255,.035)}
    .smb-tree-main{min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
    .smb-tree-main code{color:#d9edf7;overflow-wrap:anywhere}
    .smb-branch{color:#78909c;font-weight:700;min-width:14px}
    .smb-node-badges{display:inline-flex;flex-wrap:wrap;gap:4px}
    .smb-tree-hit{margin:0 0 4px 34px}
    .smb-dir-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border-bottom:1px solid rgba(255,255,255,.06);
      padding:5px 0;font-size:12px}.smb-dir-row code{color:#d9edf7;word-break:break-all}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:30;display:none;
      align-items:center;justify-content:center;padding:22px}
    .modal-backdrop.open{display:flex}
    .agent-chat-modal{width:min(980px,100%);max-height:calc(100vh - 44px);background:var(--panel);
      border:1px solid var(--line);border-radius:8px;box-shadow:0 24px 70px rgba(0,0,0,.45);
      display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
    .agent-chat-modal .chat-body{max-height:none;min-height:300px;overflow:auto}
    .investigation-modal{width:min(920px,100%);max-height:calc(100vh - 44px);background:var(--panel);
      border:1px solid var(--line);border-radius:8px;box-shadow:0 24px 70px rgba(0,0,0,.45);
      display:grid;grid-template-rows:auto 1fr;overflow:hidden}
    .investigation-head{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}
    .investigation-head b{font-size:14px}
    .investigation-head .meta{color:var(--muted);font-size:12px;font-family:ui-monospace,monospace}
    .investigation-head .chat-meta{min-width:0}
    .investigation-head .chat-meta .pill.path{max-width:260px}
    .investigation-head button{margin-left:auto}
    .investigation-body{padding:14px;display:flex;flex-direction:column;gap:9px;overflow:auto;min-height:280px}
    .mail-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,.7fr);gap:12px;align-items:start}
    .mail-thread-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
    .mail-thread-table tr:hover{background:rgba(54,194,160,.08)}
    .thread-timeline{display:grid;gap:10px;margin-top:10px}
    .thread-event{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px}
    .thread-event .event-body{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px}
    .thread-event .event-subject{font-weight:800;overflow-wrap:anywhere}
    .thread-event .event-text{color:var(--soft);line-height:1.45;overflow-wrap:anywhere}
    .thread-event .event-html{width:100%;height:min(640px,70vh);min-height:420px;border:1px solid var(--line);border-radius:6px;background:#fff}
    .thread-side{position:sticky;top:76px}

    @media (max-width:1100px){
      .agent-grid{grid-template-columns:1fr}
      .agent-workbench{grid-template-columns:1fr}
      .worker-console{grid-template-columns:1fr}

      .pipe-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .finding-toolbar{grid-template-columns:1fr 1fr}
      .smb-report-summary{grid-template-columns:repeat(3,minmax(0,1fr))}
      .report-mail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .smb-share-layout{grid-template-columns:1fr}
      .report-layout{grid-template-columns:1fr}
      .report-layout{height:auto;max-height:none;min-height:0;overflow:visible}
      .report-list-card,.report-detail-card{max-height:none;overflow:visible}
      .report-detail-card{position:static}
      .mail-layout{grid-template-columns:1fr}
      .flow-card::before,.flow-card::after{display:none}
    }
    @media (max-width:680px){
      header{height:auto;min-height:60px;align-items:flex-start;padding:12px 14px;flex-wrap:wrap}
      header h1{white-space:normal}
      header .sp,#clock{display:none}
      main{padding:14px}
      .grid{grid-template-columns:1fr 1fr}
      .agent-head{grid-template-columns:1fr;gap:8px}
      .section-head{align-items:flex-start;flex-direction:column}
      .agent-state{justify-content:flex-start}
      .agent-main{white-space:normal;line-height:1.45}
      .fanout-item{grid-template-columns:8px minmax(0,1fr) 34px}
      .session-context{grid-template-columns:1fr}
      .pipe-grid{grid-template-columns:1fr;gap:12px}
      .flow-card{width:100%;min-height:auto}
      .flow-main{grid-template-columns:86px minmax(0,1fr)}
      .finding-toolbar{grid-template-columns:1fr}
      .smb-report-summary{grid-template-columns:1fr 1fr}
      .report-mail-grid{grid-template-columns:1fr}
      .msg{grid-template-columns:1fr}
      .console-line,.thread-event{grid-template-columns:1fr}
      .msg-role{padding-top:0}
    }
  </style>
</head>
<body>
  <header>
    <h1>SMB E2E 파이프라인</h1>
    <nav>
      <button data-tab="dash" class="active">대시보드</button>
      <button data-tab="findings">Findings</button>
      <button data-tab="report">Report</button>
      <button data-tab="mail">메일 스레드</button>
      <button data-tab="admin">관리</button>
    </nav>
    <span class="sp"></span>
    <span id="clock" class="muted"></span>
  </header>
  <main id="view"></main>
  <div id="agent-chat-modal" class="modal-backdrop" onclick="backdropCloseAgentSession(event)"></div>
  <div id="investigation-modal" class="modal-backdrop" onclick="backdropCloseInvestigation(event)"></div>

<script>
function api(path, params={}){ const u=new URL(path, location.origin);
  for(const[k,v]of Object.entries(params)) u.searchParams.set(k,v); return u; }
async function getJSON(path, params){ const r=await fetch(api(path,params)); if(!r.ok) throw new Error(r.status); return r.json(); }
async function postJSON(path, body={}){ const r=await fetch(api(path),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); if(!r.ok) throw new Error(r.status); return r.json(); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function looksHtml(s){ return /<\/?[a-z][\s\S]*>/i.test(String(s||'')); }
function mailSrcdoc(raw){
  let html=String(raw||'');
  html=html.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  html=html.replace(/`([^`]+)`/g,'<code style="background:#f4f6f8;border:1px solid #d9e0e5;border-radius:4px;padding:1px 4px">$1</code>');
  const css=`<style>body{margin:16px;font-family:'Malgun Gothic',Arial,sans-serif;color:#222;line-height:1.6}table{max-width:100%;border-collapse:collapse}td,th{vertical-align:top}td:first-child{white-space:nowrap;min-width:86px}code{white-space:nowrap}</style>`;
  if(/<html[\s>]/i.test(html)){
    return /<\/head>/i.test(html) ? html.replace(/<\/head>/i, css+'</head>') : html.replace(/<body[^>]*>/i, m=>m+css);
  }
  return `<!doctype html><html><head>${css}</head><body>${html}</body></html>`;
}
function renderMailBody(m){
  const html=String(m?.body_html||'');
  const body=String(m?.body_excerpt||'');
  if(html||((m?.direction||'')==='out'&&looksHtml(body))){
    return `<iframe class="event-html" loading="lazy" sandbox="" srcdoc="${esc(mailSrcdoc(html||body))}"></iframe>`;
  }
  return `<div class="event-text">${body?esc(body):'본문 없음'}</div>`;
}
const $=s=>document.querySelector(s);
const UI_STATE_KEY='smb-e2e-ui-state-v2';
const VALID_TABS=new Set(['dash','findings','report','mail','admin']);
function readUiState(){
  try{
    const raw=localStorage.getItem(UI_STATE_KEY);
    const parsed=raw?JSON.parse(raw):{};
    return parsed&&typeof parsed==='object'?parsed:{};
  }catch(e){ return {}; }
}
const persistedUiState=readUiState();
function clampNumber(v,min=0){
  const n=Number(v);
  return Number.isFinite(n)?Math.max(min,n):min;
}
function setNavActive(){
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===activeTab));
}
function saveUiState(){
  try{
    localStorage.setItem(UI_STATE_KEY,JSON.stringify({
      activeTab,
      findingState:typeof findingState!=='undefined'?findingState:null,
      reportState:typeof reportState!=='undefined'?reportState:null,
      mailState:typeof mailState!=='undefined'?mailState:null,
      selectedAgent,
      reportScroll:typeof reportScroll!=='undefined'?reportScroll:null,
    }));
  }catch(e){}
}
function captureReportScroll(){
  if(activeTab!=='report') return;
  const list=document.querySelector('.report-list-card');
  const detail=document.querySelector('.report-detail-card');
  if(list) reportScroll.list=list.scrollTop;
  if(detail) reportScroll.detail=detail.scrollTop;
  saveUiState();
}
window.addEventListener('beforeunload',()=>{ captureReportScroll(); saveUiState(); });
let activeTab=VALID_TABS.has(persistedUiState.activeTab)?persistedUiState.activeTab:'dash';
let selectedAgent=persistedUiState.selectedAgent||null;

function setActiveTab(tab){
  captureReportScroll();
  activeTab=tab;
  setNavActive();
  saveUiState();
  render();
}

function setHTMLIfChanged(el, html){
  if(el&&el.innerHTML!==html) el.innerHTML=html;
}

function ensureDashboardShell(){
  const v=$('#view');
  if(!v) return false;
  if($('#dash-summary')&&$('#pipeline-grid')&&$('#agent-console-shell')) return true;
  v.innerHTML=`<div id="dash-status" class="muted"></div>
    <div id="dash-summary"><p class="muted">불러오는 중...</p></div>
    <div class="section-head"><div><h2>파이프라인 흐름</h2><div class="muted">collector부터 reverify까지 현재 처리 흐름입니다.</div></div></div>
    <div class="pipeline-board"><div id="pipeline-grid" class="pipe-grid"></div></div>
    <div class="section-head"><div><h2>Heartbeats</h2><div class="muted">Detail 은 그 시각의 마지막 결과다 — Age 를 같이 볼 것.</div></div></div>
    <div class="pipeline-board"><div id="heartbeat-panel"></div></div>
    <div class="section-head"><div><h2>Operator / Worker Console</h2><div class="muted">대단위 병렬작업에서는 operator와 worker transcript를 분리해 확인합니다.</div></div></div>
    <div id="agent-console-shell"></div>`;
  return true;
}

// 하트비트 신선도. detail 은 **마지막 실행 결과가 그대로 박혀 있는 값**이라, 나이를 같이
// 보여주지 않으면 한 달 전 숫자를 오늘 결과로 읽게 된다(2026-08-16 실측: 하트비트 31개 중
// 26개가 24h 이상 낡았는데 화면엔 구분이 없었다). alive 는 API 의 600초 기준이라
// 그것만 쓰면 6시간 cron 이 항상 빨갛게 보이므로 24h/7d 구간을 따로 둔다.
function hbTier(h){
  const sec=Math.max(0,Math.floor(Date.now()/1000-Number(h.last_beat||0)));
  if(!h.last_beat)return {cls:'meta',label:'기록없음'};
  if(h.alive)return {cls:'alive',label:'LIVE'};
  if(sec<86400)return {cls:'warn',label:'대기'};
  if(sec<604800)return {cls:'dead',label:'하루+'};
  return {cls:'dead',label:'★일주일+'};
}
function heartbeatTable(d){
  const rows=Object.entries(d.heartbeats||{})
    .sort((a,b)=>Number(b[1].last_beat||0)-Number(a[1].last_beat||0))
    .map(([k,h])=>{
      const t=hbTier(h);
      return `<tr><td><code>${esc(k)}</code></td><td><span class="pill ${t.cls}">${t.label}</span></td>`
        +`<td>${esc(h.phase||'-')}</td><td>${age(h.last_beat)}</td><td class="muted">${esc(h.detail||'')}</td></tr>`;
    }).join('');
  return `<table style="width:100%"><thead><tr><th>Agent</th><th>신선도</th><th>Phase</th><th>Age</th><th>Detail</th></tr></thead>`
    +`<tbody>${rows||'<tr><td colspan="5" class="muted">데이터 없음</td></tr>'}</tbody></table>`;
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setActiveTab(b.dataset.tab));

function fmt(n){ const x=Number(n)||0; return x>=10000?x.toLocaleString('ko-KR'):x; }
function age(ts){
  if(!ts) return '';
  const sec=Math.max(0,Math.floor(Date.now()/1000-Number(ts)));
  if(sec<60) return sec+'s';
  if(sec<3600) return Math.floor(sec/60)+'m';
  if(sec<86400) return Math.floor(sec/3600)+'h';
  return Math.floor(sec/86400)+'d';
}
function statusPill(alive, enabled){
  if(enabled===false) return '<span class="pill dead">OFF</span>';
  return `<span class="pill ${alive?'alive':'dead'}">${alive?'LIVE':'STALE'}</span>`;
}
function isIpLike(x){ return /^\d{1,3}(\.\d{1,3}){3}$/.test(String(x||'')); }
function workerStageLabel(component){
  return ({task:'점검',mail:'리포팅·메일',reverify:'답장·재검증'})[component]||component||'-';
}
function workerStatusLabel(status){
  const value=String(status||'');
  return ({
    active:'진행 중',queued:'대기',finding:'finding 확인',done:'완료',
    running:'실행 중',completed:'완료',failed:'실패',
    pending:'대기',walked:'워킹 완료',listing_reviewed:'목록 검토 완료',
    in_progress:'진행 중',triaged_completed:'점검 완료',triaged_errored:'점검 오류',
    ignored:'큐 제외',closed:'완결',
    draft:'레포트 초안',reported:'레포트 정리 완료',
    awaiting_reply:'메일 발송 후 회신 대기',reply_received:'회신 수신',
    reverifying:'재검증 중',re_requested:'재조치 요청',
    partially_remediated:'부분 조치 확인',
    exception_review:'업무 예외 검토',owner_update_needed:'담당자 확인 필요',
    owner_reassignment_review:'담당자 변경 검토',reassigned:'담당자 이관',
    remediated:'조치 완료',escalated:'에스컬레이션',
  })[value]||value;
}
function sessionTargetDisplay(d){
  if(!d) return '';
  if(d.target&&d.target.display) return d.target.display;
  if(d.share&&d.share.host&&d.share.share) return '\\\\'+d.share.host+'\\'+d.share.share;
  if(d.thread&&d.thread.host) return d.thread.host;
  return d.title||'';
}
function renderAgentTranscriptMeta(d, fallbackSource=''){
  const chips=[];
  const t=d&&d.transcript?d.transcript:{};
  const add=(value,cls='')=>{
    const s=String(value??'').trim();
    if(s) chips.push(`<span class="pill ${cls}">${esc(s)}</span>`);
  };
  add(sessionTargetDisplay(d),'path');
  add((d&&d.status_label)||workerStatusLabel(d&&d.status));
  add((d&&d.source)||fallbackSource);
  if(t.status) add('실행 '+workerStatusLabel(t.status));
  if(t.entry_count!==undefined&&t.entry_count!==null) add(fmt(t.entry_count)+' events');
  add(t.subagent_type);
  add(t.evidence_dir,'path');
  return `<span class="chat-meta">${chips.join('')}</span>`;
}
function messageText(m){ return (m&&m.content&&m.content.text)||m.text||''; }
function displayMessageText(m){
  const raw=String(messageText(m)||'');
  const target=raw.match(/^target=(\\\\.+?)\s+status=([a-z_]+)$/);
  if(target) return `대상: ${target[1]}\n상태: ${workerStatusLabel(target[2])}`;
  const status=raw.match(/^status=([a-z_]+)\s+severity=([^\s]+)\s+hits=([0-9]+)(?:\n([\s\S]*))?$/);
  if(status){
    const tail=status[4]?`\n${status[4]}`:'';
    return `상태: ${workerStatusLabel(status[1])}\n위험도: ${status[2]}\n확인된 hit: ${status[3]}건${tail}`;
  }
  return raw;
}
function renderAgentSessionContext(d){
  const rows=[];
  const add=(label,value,cls='')=>{
    const s=String(value??'').trim();
    if(s) rows.push(`<div><small>${esc(label)}</small><strong class="${cls}">${esc(s)}</strong></div>`);
  };
  add('단계',(d&&d.stage)||workerStageLabel(d&&d.component));
  add('대상',sessionTargetDisplay(d),'path');
  add('상태',(d&&d.status_label)||workerStatusLabel((d&&d.status)||((d&&d.transcript)?d.transcript.status:'')));
  return rows.length?`<div class="session-context">${rows.join('')}</div>`:'';
}
function renderMessages(messages, empty='메시지 없음'){
  const rows=(messages||[]).map(m=>`<div class="msg"><div class="msg-role">${esc(m.role||m.direction||'-')}</div><div class="msg-text">${esc(displayMessageText(m))}</div></div>`).join('');
  return rows||`<div class="muted">${esc(empty)}</div>`;
}
function chatPlaceholder(){
  return '<div class="chat-head"><b>Worker Chat</b><span class="pill">worker 선택</span></div><div class="chat-empty">왼쪽 worker를 선택하면 대상별 채팅형 transcript가 여기에 표시됩니다.</div>';
}

function pipelineTargetLabel(x){
  if(x&&typeof x==='object') return x.label||x.display||x.target||'';
  return String(x??'');
}
function pipelineTargetAttr(x,name){
  return x&&typeof x==='object' ? String(x[name]||'') : '';
}
function targetList(s){
  const t=s.targets||{}; const active=t.active||[]; const next=t.next||[];
  const live=active.length>0; const items=(live?active:next).slice(0,40);
  const rows=items.map(x=>{
    const label=pipelineTargetLabel(x);
    const component=pipelineTargetAttr(x,'component');
    const ref=pipelineTargetAttr(x,'session_ref');
    const inspect=Boolean(component&&ref);
    return `<div class="target-row ${live?'live':''} ${inspect?'inspectable':''}" data-target="${esc(label)}" data-stage="${esc(s.key||'')}" data-component="${esc(component)}" data-ref="${esc(ref)}" onclick="openPipelineTargetFromRow(this)" title="${inspect?'클릭: agent 대화창 열기':''}">
      <span class="target-mark"></span><span>${esc(label)}</span></div>`;
  }).join('');
  return `<div class="target-list">
    <div class="target-head">${live?'진행중 '+active.length:'대기 대상'}</div>
    <div class="target-body">${rows||'<div class="target-empty">대상 없음</div>'}</div>
  </div>`;
}

function powerButton(s){
  if(!s.control_key) return '';
  const on=s.node_enabled!==false;
  return `<button class="power-toggle ${on?'on':'off'}" onclick="toggleCron('${s.control_key}',${on?0:1})">${on?'ON':'OFF'}</button>`;
}

function stepCard(s, cls=''){
  const metrics=(s.metrics||[]).slice(0,6).map(m=>`<div class="metric-row"><span>${esc(m.label)}</span><b>${fmt(m.value)}${esc(m.unit||'')}</b></div>`).join('');
  const needsRunner=s.proc&&s.node_enabled!==false&&(s.status==='active'||Number(s.queue||0)>0||Number(s.processing||0)>0);
  const down=needsRunner&&!s.proc_alive;
  const procDot=s.proc?`<span class="proc-dot ${s.proc_alive?'live':''}"></span>`:'<span class="proc-dot live"></span>';

function smbFlagTone(flag){
  const raw=String(flag||'');
  if(raw.includes('critical')||raw.includes('high')||raw.includes('review')) return 'review';
  if(raw.includes('error')||raw.includes('denied')||raw.includes('not_found')) return 'error';
  if(raw.includes('writable')||raw.includes('readable')||raw.includes('print')) return 'exposure';
  if(raw.includes('hit')||raw.includes('finding')) return 'signal';
  return 'meta';
}
function renderSmbFlags(flags){
  const hidden=new Set(['null_readable','guest_readable','auth_readable','share_writable','file_writable','directory_writable']);
  const list=(flags||[]).filter(f=>f&&!hidden.has(f));
  return list.length?`<span class="smb-risk-flags">${list.map(f=>`<span class="smb-pill ${smbFlagTone(f)}">${esc(smbFlagLabel(f))}</span>`).join('')}</span>`:'';
}
function rowSeverity(s){
  if(s.severity) return s.severity;
  const c=s.counts||{}, m=s.modes||{}, rw=s.rw||{};
  if(c.lifecycle_findings||c.confirmed_hits||rw.write||(rw.read&&(m.null||m.guest))) return 'high';
  if(rw.read&&m.auth) return 'medium';
  if(s.excluded_reason==='print') return 'low';
  return 'informational';
}
function rowSummary(s){
  const c=s.counts||{}, m=s.modes||{}, rw=s.rw||{};
  if(s.summary) return s.summary;
  if(c.lifecycle_findings) return `제출된 SMB finding ${fmt(c.lifecycle_findings)}건`;
  if(c.confirmed_hits) return `확정 본문 근거 ${fmt(c.confirmed_hits)}건`;
  if(c.file_with_hits) return `본문 후보 근거 ${fmt(c.file_with_hits)}개 파일`;
  if(s.excluded_reason==='print') return '프린터 공유로 점검 큐에서는 제외됐지만 SMB 읽기 노출은 목록에 유지';
  if(rw.write) return '공유 쓰기 권한이 열려 있음';
  if(rw.read&&(m.null||m.guest)) return 'NULL/GUEST 읽기 가능한 공유';
  if(rw.read&&m.auth) return 'AUTH 읽기 가능한 공유';
  return rw.read?'공유 읽기 가능':'열린 SMB 공유';
}
function accessPillsForRow(s){
  const m=s.modes||{}, rw=s.rw||{}, out=[];
  if(rw.read&&m.null) out.push('<span class="smb-pill exposure">NULL 읽기</span>');
  if(rw.read&&m.guest) out.push('<span class="smb-pill exposure">GUEST 읽기</span>');
  if(rw.read&&m.auth) out.push('<span class="smb-pill access">AUTH 읽기</span>');
  if(rw.write) out.push('<span class="smb-pill exposure">쓰기</span>');
  if(rw.read&&!out.length) out.push('<span class="smb-pill access">읽기</span>');
  return out.join('')||'<span class="smb-pill meta">권한 미확인</span>';
}
function hostSeverity(h){
  const shares=h.shares||[];
  const rank={critical:5,high:4,medium:3,low:2,informational:1};
  let best='informational', bestRank=1;
  shares.forEach(s=>{ const sev=rowSeverity(s); if((rank[sev]||0)>bestRank){ best=sev; bestRank=rank[sev]||0; } });
  return best;
}
function hostSummary(h){
  const c=h.counts||{};
  if(c.lifecycle_share_total) return `제출된 SMB finding이 있는 share ${fmt(c.lifecycle_share_total)}개`;
  if(c.confirmed_hits) return `확정 본문 근거 ${fmt(c.confirmed_hits)}건`;
  if(c.public_share_total) return `NULL/GUEST 공개 노출 share ${fmt(c.public_share_total)}개`;
  if(c.print_share_total) return `print$ 포함 프린터 공유 ${fmt(c.print_share_total)}개`;
  if(c.auth_share_total) return `AUTH 읽기 가능 share ${fmt(c.auth_share_total)}개`;
  return `열린 SMB share ${fmt(c.open_share_total||c.share_total||0)}개`;
}
function hostAccessPills(h){
  const c=h.counts||{}, out=[];
  if(c.public_share_total) out.push(`<span class="smb-pill exposure">NULL/GUEST ${fmt(c.public_share_total)}</span>`);
  if(c.auth_share_total) out.push(`<span class="smb-pill access">AUTH ${fmt(c.auth_share_total)}</span>`);
  if(c.writable_share_total) out.push(`<span class="smb-pill exposure">쓰기 ${fmt(c.writable_share_total)}</span>`);
  if(c.print_share_total) out.push(`<span class="smb-pill exposure">print ${fmt(c.print_share_total)}</span>`);
  if(c.lifecycle_share_total) out.push(`<span class="smb-pill signal">제출 ${fmt(c.lifecycle_share_total)}</span>`);
  return out.join('')||'<span class="smb-pill meta">권한 미확인</span>';
}
function renderHostShares(h){
  const rows=(h.shares||[]).slice(0,8).map(s=>{

  return rows+more;
}
function hostListParams(state){
  const p={limit:FINDING_PAGE_SIZE,offset:state.page*FINDING_PAGE_SIZE};
  if(state.q) p.q=state.q;

function formatBytes(value){
  if(value===null||value===undefined||value==='') return '크기 미확인';
  let n=Number(value||0); if(!Number.isFinite(n)) return '크기 미확인';
  if(n<=0) return '0 B';
  const units=['B','KB','MB','GB','TB']; let u=0;
  while(n>=1024&&u<units.length-1){ n/=1024; u++; }
  return `${n.toFixed(u===0||n>=10?0:1)} ${units[u]}`;
}

// 로그인 검증 증거 추출 — state_domain._login_proof_of 와 같은 규칙(중첩 login_probe/평면/legacy multi).
// 한쪽 shape 만 알면 데이터 형태가 바뀔 때 배지가 조용히 사라진다.
function loginProofOf(v,d){
  const depth=d||0;
  if(depth>4||!v||typeof v!=='object'||Array.isArray(v)) return null;
  if(v.login_probe&&typeof v.login_probe==='object'&&!Array.isArray(v.login_probe)) return v.login_probe;
  if(v.kind==='credential_login_probe'){
    // 도구가 에이전트에 돌려주는 최상위 래퍼({kind,domain,probed,results:[...]})를 LLM 이 그대로
    // 인용하면 래퍼에는 result 가 없어 배지가 통째로 사라진다 → results[] 안으로 한 단계(성공 우선).
    if(v.result===undefined&&Array.isArray(v.results)){
      let first=null;
      for(const r of v.results.slice(0,32)){
        if(!r||typeof r!=='object') continue;
        if(r.result==='authenticated') return r;
        if(first===null) first=r;
      }
      return first;
    }
    return v;
  }
  if(v.kind==='multi'&&Array.isArray(v.probes)){
    for(const p of v.probes.slice(0,32)){const f=loginProofOf(p,depth+1); if(f) return f;}
  }
  return null;
}
const LOGIN_RESULT_LABEL={authenticated:'로그인 검증됨',auth_failed:'로그인 실패',account_locked:'계정 잠김',credential_expired:'비밀번호 만료',session_denied:'세션 거부'};
const LOGIN_ENGINES={mssql:1,postgres:1};
// authenticated 는 proves_validity 까지 true 여야 성공으로 읽는다(모순 값은 아무 주장도 하지 않음).
function loginConfirmed(p){return !!p&&p.result==='authenticated'&&p.proves_validity===true;}
// host 는 IPv4 또는 점 포함 FQDN 만. 콜론/포트가 섞인 문자열(`10.0.0.5:443`)을 그대로 쓰면
// `10.0.0.5:443:1433` 같은 모호한 endpoint 가 되고, 전부-숫자 TLD(`012.1.1.1`)는 오독을 부른다.
function loginEndpoint(p){
  const h=typeof p.endpoint_host==='string'?p.endpoint_host.trim():'';
  if(!h||h.length>253||/[^A-Za-z0-9.-]/.test(h)) return '';
  const labels=h.split('.');
  if(labels.length<2||labels.some(l=>!l||l.length>63||l.startsWith('-')||l.endsWith('-'))) return '';
  const isIPv4=labels.length===4&&labels.every(l=>/^\d{1,3}$/.test(l)&&!(l.length>1&&l[0]==='0')&&+l<=255);
  if(!isIPv4&&/^\d+$/.test(labels[labels.length-1])) return '';   // 깨진 IP 위장 표기
  const port=(Number.isInteger(p.endpoint_port)&&p.endpoint_port>0&&p.endpoint_port<=65535)?p.endpoint_port:null;
  return port?`${h}:${port}`:h;
}
// 고정 어휘 밖 result 는 표시하지 않는다 — DB 문자열이 그대로 배지 문구가 되면 '검증됨' 위조가 된다.
// principal/bound_masked/auth_attempts/detail/policy 는 표시하지 않는다.
function loginProbePill(hit){
  const p=loginProofOf(hit&&hit.validation);
  if(!p) return '';
  if(p.engine!==undefined&&p.engine!==null
     &&!Object.prototype.hasOwnProperty.call(LOGIN_ENGINES,p.engine)) return '';  // 미지 엔진=미지 경로
  if(p.result==='authenticated'&&!loginConfirmed(p)) return '';                   // 모순
  // hasOwnProperty 로 조회 — `constructor`/`toString`/`__proto__` 가 프로토타입 체인을 타고
  // '고정 어휘 밖은 표시하지 않는다' 계약을 뚫어 유령 배지를 만드는 것을 막는다.
  const label=Object.prototype.hasOwnProperty.call(LOGIN_RESULT_LABEL,p.result)?LOGIN_RESULT_LABEL[p.result]:null;
  if(!label) return '';
  const cls=loginConfirmed(p)?'evidence-true':'evidence-unverified';
  const where=loginEndpoint(p);
  const tip=p.single_attempt===true?'단발 시도 · 쿼리 없음 · 중앙 원장 기록':'크리덴셜 로그인 프로브 결과';
  return ` <span class="smb-pill ${cls}" title="${esc(tip)}">${esc('프로브 '+label+(where?' '+where:''))}</span>`;
}
function renderSmbHits(hits){
  const all=Array.isArray(hits)?hits.filter(h=>h&&typeof h==='object'):[];
  if(!all.length) return '';
  // 순위 계산 상한(DoS). 자르기를 순위보다 먼저 하면 뒤쪽의 검증 hit 이 또 사라지므로 넉넉히 잡고,
  // '+N개 더 있음' 라벨은 잘린 수가 아니라 **전체 수** 기준으로 정직하게 쓴다.
  const list=all.slice(0,2000);
  // 상위 5건만 그리므로 **확인된 로그인** → 기타 프로브 결과 → 일반 순으로 배치한다.
  // (단순히 'proof 있음' 으로만 정렬하면 auth_failed 5건이 진짜 성공을 밀어낸다.)
  // rank 는 **미리 한 번만** 계산한다 — 비교자 안에서 loginProofOf 를 부르면 hit 당 트리 순회가
  // ~9배 중복된다(5,000 hits 에서 45,915회 측정).
  const ranked=list.map((h,i)=>{const p=loginProofOf(h&&h.validation); return {h,i,r:!p?2:(loginConfirmed(p)?0:1)};});
  ranked.sort((a,b)=>a.r-b.r||a.i-b.i);
  const ordered=ranked.map(x=>x.h);
  return `<div class="smb-hit-list">${ordered.slice(0,5).map(h=>`<div><strong>${esc(smbHitLabel(h))}</strong> ${evidencePill(h.evidence_verdict,h.evidence_label)}${loginProbePill(h)} <span class="muted">${h.line_no?esc(h.line_no)+'행':'행 번호 없음'}</span><br><code>${esc(h.masked||'')}</code>${h.line_preview?` <span>${esc(h.line_preview)}</span>`:''}</div>`).join('')}${all.length>5?`<div class="muted">+${esc(all.length-5)}개 근거 더 있음</div>`:''}</div>`;
}
function smbFileBadges(file,share){

  badges.push(renderSmbFlags(file.risk_flags));

function smbDirectoryBadges(dir,share){

function makeTreeNode(name,type,path=''){ return {name,type,path,children:new Map(),directory:null,file:null}; }
function ensureTreeDirectory(root,parts,fullPath){
  let node=root, path='';
  parts.forEach(part=>{
    path=path?`${path}/${part}`:part;
    if(!node.children.has(part)) node.children.set(part,makeTreeNode(part,'dir',path));
    node=node.children.get(part);
  });
  if(fullPath!==undefined) node.path=fullPath;
  return node;
}
function buildSmbTree(share){
  const root=makeTreeNode(`//${share.host}/${share.share}`,'share','');
  (share.directories||[]).forEach(dir=>{
    const parts=String(dir.path||'').split('/').filter(Boolean);
    const node=parts.length?ensureTreeDirectory(root,parts,dir.path):root;
    node.directory=dir;
  });
  (share.files||[]).forEach(file=>{
    const parts=String(file.path||'').split('/').filter(Boolean);
    const name=parts.pop()||file.name||file.path||'file';
    const parent=parts.length?ensureTreeDirectory(root,parts):root;
    const fileNode=makeTreeNode(name,'file',file.path||name);
    fileNode.file=file;
    parent.children.set(`file:${file.path||name}`,fileNode);
  });
  markSmbTreeFindings(root);
  return root;
}
function markSmbTreeFindings(node){
  const own=node.type==='file'?Boolean(node.file&&node.file.has_finding):Boolean(node.directory&&node.directory.has_finding);
  let child=false;
  Array.from(node.children.values()).forEach(c=>{ if(markSmbTreeFindings(c)) child=true; });
  node.hasFindingPath=own||child;
  return node.hasFindingPath;
}
function sortTreeChildren(node){
  return Array.from(node.children.values()).sort((a,b)=>{
    if(a.type!==b.type) return a.type==='file'?1:-1;
    return String(a.name).localeCompare(String(b.name));
  });
}
function renderSmbTreeNode(node,share,depth=0,expandFindings=true){
  const indent=Math.max(0,depth)*18;
  const branch=depth>0?'ㄴ':'';
  if(node.type==='file'){
    const file=node.file||{}, badges=smbFileBadges(file,share);
    return `<div class="smb-tree-row smb-tree-file" style="margin-left:${esc(indent)}px">
      <span class="smb-tree-main"><span class="smb-branch">${esc(branch)}</span><span>문서</span><code>${esc(node.name)}</code>
      <span class="smb-file-meta">${esc(formatBytes(file.size))}</span>${badges?`<span class="smb-node-badges">${badges}</span>`:''}</span>
    </div><div class="smb-tree-hit" style="margin-left:${esc(indent+34)}px">${renderSmbHits(file.hits)}</div>`;
  }
  const children=sortTreeChildren(node).map(c=>renderSmbTreeNode(c,share,depth+1,expandFindings)).join('');
  const dir=node.directory||{};
  const open=node.type==='share'||(expandFindings&&node.hasFindingPath)?' open':'';
  const label=node.type==='share'?'공유 폴더':'폴더';
  const badges=node.type==='share'?smbShareBadges(share):(node.directory?smbDirectoryBadges(dir,share):'');
  return `<details${open}><summary><span class="smb-tree-row" style="margin-left:${esc(indent)}px">
    <span class="smb-tree-main"><span class="smb-branch">${esc(branch)}</span><span>${esc(label)}</span><code>${esc(node.name)}</code>
    ${badges?`<span class="smb-node-badges">${badges}</span>`:''}</span></span></summary>${children}</details>`;
}
function renderSmbTree(share,findingsOnly){
  const root=buildSmbTree(share);
  const expandFindings=findingsOnly!==false;
  return `<div class="smb-tree-panel"><div class="smb-tree">${renderSmbTreeNode(root,share,0,expandFindings)}</div></div>`;
}

function shareHasRiskFlag(share,flag){ return (share.risk_flags||[]).includes(flag)||(share.files||[]).some(f=>(f.risk_flags||[]).includes(flag)); }
function smbActionItems(share){

}

async function approveShareException(shareId,threadId){
  const reason=prompt('조치 예외 사유를 입력하세요.','담당자 확인 완료 - 예외 승인');
  if(!reason) return;
  try{
    await postJSON('/api/smb/shares/'+encodeURIComponent(shareId)+'/exception',{
      thread_id:Number(threadId)||null,
      reason,
      approved_by:'operator',
    });
    if(reportState.threadId&&reportState.host) await loadReportThreadDetail(reportState.threadId,reportState.host,reportState.findingsOnly);
    else renderReport();
  }catch(e){ alert('예외 처리 실패: '+e); }

  </section>`;
}
async function loadReportDetail(host,findingsOnly=true,opts={}){
  const box=$('#report-detail'); if(!box) return;
  box.innerHTML='<p class="muted">SMB IP 리포트 불러오는 중...</p>';
  try{
    const params={findings_only:String(!!findingsOnly),limit_per_share:1000};
    if(reportState.cycleKey) params.cycle_key=reportState.cycleKey;
    const report=await getJSON('/api/smb/reports/'+encodeURIComponent(host),params);
    box.innerHTML=renderSmbReport(report,host,!!findingsOnly,true);
    syncReportLayoutHeight();
    attachReportScrollHandlers();
    if(opts.preserveScroll) restoreReportScroll('detail');
    else { reportScroll.detail=0; box.scrollTop=0; saveUiState(); }
  }catch(e){
    box.innerHTML=`<div class="detail-head"><button class="report-back" onclick="renderReport()">목록으로</button><strong>${esc(host)}</strong></div><p class="muted">리포트 로드 실패: ${esc(e)}</p>`;
    syncReportLayoutHeight();
  }
}
async function loadReportThreadDetail(threadId,host,findingsOnly=true,opts={}){
  const box=$('#report-detail'); if(!box) return;
  box.innerHTML='<p class="muted">IP 리포트 불러오는 중...</p>';
  try{
    const threadDetail=await getJSON('/api/mail-threads/'+encodeURIComponent(threadId));
    const thread=threadDetail.thread||{};
    const cycleKey=thread.last_cycle_key||thread.first_cycle_key||reportState.cycleKey||'';
    const params={
      findings_only:String(!!findingsOnly),
      limit_per_share:findingsOnly?500:200,
      thread_id:String(threadId),
    };
    if(cycleKey) params.cycle_key=cycleKey;
    const report=await getJSON('/api/smb/reports/'+encodeURIComponent(host),params);
    box.innerHTML=renderSmbReport(report,host,!!findingsOnly,true,threadDetail);
    syncReportLayoutHeight();
    attachReportScrollHandlers();
    if(opts.preserveScroll) restoreReportScroll('detail');
    else { reportScroll.detail=0; box.scrollTop=0; saveUiState(); }
  }catch(e){
    box.innerHTML=`<div class="detail-head"><button class="report-back" onclick="renderReport()">목록으로</button><strong>${esc(host)}</strong></div><p class="muted">리포트 로드 실패: ${esc(e)}</p>`;
    syncReportLayoutHeight();
  }
}
function openReportThread(threadId,host,findingsOnly=reportState.findingsOnly){
  captureReportScroll();
  const changed=Number(reportState.threadId)!==Number(threadId)||reportState.host!==host||reportState.findingsOnly!==!!findingsOnly;
  reportState.threadId=Number(threadId);
  reportState.host=host;
  reportState.findingsOnly=!!findingsOnly;
  if(changed) reportScroll.detail=0;
  saveUiState();
  if(activeTab==='report'){
    markSelectedReportThread();
    loadReportThreadDetail(reportState.threadId,reportState.host,reportState.findingsOnly,{preserveScroll:!changed});
  }
  else setActiveTab('report');
}
function openSmbHost(host,findingsOnly=true){
  captureReportScroll();
  reportState.host=host;
  reportState.findingsOnly=!!findingsOnly;
  reportState.threadId=null;
  reportScroll.detail=0;
  saveUiState();
  if(activeTab==='report') renderReport();
  else setActiveTab('report');
}
async function openSmbFinding(assetEncoded,findingsOnly=false){
  captureReportScroll();
  activeTab='findings';
  setNavActive();
  saveUiState();
  const asset=decodeURIComponent(assetEncoded);
  const v=$('#view'); v.innerHTML='<p class="muted">SMB 리포트 불러오는 중...</p>';
  try{
    const report=await getJSON('/api/smb/report-by-asset',{asset,findings_only:String(!!findingsOnly),limit_per_share:1000});
    v.innerHTML=renderSmbReport(report,asset,!!findingsOnly,false);
  }catch(e){
    v.innerHTML=`<div class="detail-head"><button class="report-back" onclick="renderFindings()">목록으로</button><strong>${esc(asset)}</strong></div><p class="muted">리포트 로드 실패: ${esc(e)}</p>`;
  }
}

async function renderMail(){
  const v=$('#view'); v.innerHTML='<p class="muted">불러오는 중...</p>';
  const params={};
  if(mailState.cycleKey) params.cycle_key=mailState.cycleKey;
  let d; try{ d=await getJSON('/api/mail-threads',params); }catch(e){ v.innerHTML='<p class="muted">로드 실패: '+esc(e)+'</p>'; return; }
  mailState.cycleKey=d.cycle_key||d.current_cycle_key||mailState.cycleKey||'';
  const sc=d.status_counts||{};
  const scHtml=Object.entries(sc).map(([s,n])=>`<span class="pill">${esc(s)}: ${esc(n)}</span>`).join(' ');
  const items=d.items||[];
  if(mailState.threadId&&!items.some(t=>Number(t.id)===Number(mailState.threadId))) mailState.threadId=null;
  const rows=items.map(t=>`<tr class="toggle" onclick="showThread(${t.id})">
    <td>${esc(t.host)}</td><td class="sev-${esc(t.severity)}">${esc(t.severity||'-')}</td>
    <td><span class="pill ${t.status==='reply_received'?'warn':''}">${esc(t.status)}</span></td><td>${esc(t.attempt_count||0)}회</td><td class="muted">${esc(t.subject_tag||'')}</td>
    <td><button class="act open-thread-detail" onclick="event.stopPropagation();showThread(${t.id})">상세</button></td></tr>`).join('');
  const cycleSelect=`<label>주차<select id="mcycle" onchange="applyMailCycle()">${cycleOptions(d.cycles||[],d.current_cycle_key||d.cycle_key||'',mailState.cycleKey)}</select></label>`;
  v.innerHTML=`<div class="section-head"><div><h2>메일 스레드</h2><div class="muted">조치요청 발송, 담당자 답장, 재검증 상태를 한 화면에서 추적합니다.</div></div><div class="tag-row">${cycleSelect}<span class="pill">주차 ${esc(d.cycle_key||'전체')}</span>${scHtml}</div></div>
    <div class="mail-layout">
      <section class="mail-thread-card"><table class="mail-thread-table"><tr><th>host</th><th>심각도</th><th>상태</th><th>왕복</th><th>제목태그</th><th>상세</th></tr>${rows||'<tr><td class=muted colspan=6>없음</td></tr>'}</table></section>
      <aside id="thread-detail" class="thread-side"><div class="mail-thread-card"><div class="muted">왼쪽 스레드를 선택하면 메일 timeline과 관련 worker transcript가 표시됩니다.</div></div></aside>
    </div>`;
  if(mailState.threadId) showThread(mailState.threadId);
}
function applyMailCycle(){
  mailState.cycleKey=$('#mcycle')?.value||'';
  mailState.threadId=null;
  saveUiState();
  renderMail();
}
async function showThread(id){
  mailState.threadId=Number(id);
  saveUiState();
  const box=$('#thread-detail'); box.innerHTML='<div class="mail-thread-card"><p class="muted">로드 중...</p></div>';
  try{ const d=await getJSON('/api/mail-threads/'+id);
    const timeline=(d.messages||[]).map(m=>`<div class="thread-event">
      <span class="role-badge">${esc(m.direction||'-')}</span>
      <div class="event-body"><div class="event-subject">${esc(m.subject||'(제목 없음)')}</div>
        <div class="tag-row"><span class="pill">${esc(m.agent_verdict||'-')}</span>${m.received_at?`<span class="pill">${esc(age(m.received_at))}</span>`:''}</div>
        ${renderMailBody(m)}</div>
    </div>`).join('');
    const session=d.session||null;
    box.innerHTML=`<div class="mail-thread-card"><div class="console-head"><div><div class="console-title">스레드 ${esc(id)} · ${esc(d.thread.host)}</div><div class="console-sub">${esc(d.thread.status||'-')} · attempt ${esc(d.thread.attempt_count||0)}</div></div><span class="pill ${d.thread.status==='reply_received'?'warn':'alive'}">${esc(d.thread.severity||'-')}</span></div>
      <div class="thread-timeline">${timeline||'<div class="muted">메시지 없음</div>'}</div></div>
      ${session?`<div class="mail-thread-card" style="margin-top:12px"><div class="chat-head"><b>관련 Worker</b>${renderAgentTranscriptMeta(session,'thread-session')}</div><div class="chat-body">${renderMessages(session.messages)}</div></div>`:''}`;
  }catch(e){ box.innerHTML='<div class="mail-thread-card"><p class="muted">로드 실패: '+esc(e)+'</p></div>'; }
}

async function renderAdmin(){
  const v=$('#view'); v.innerHTML='<p class="muted">불러오는 중...</p>';
  let subs,creds;
  try{ subs=await getJSON('/api/admin/subnets'); creds=await getJSON('/api/admin/credentials'); }
  catch(e){ v.innerHTML='<p class="muted">관리 로드 실패: '+esc(e)+'</p>'; return; }
  const subRows=(subs.items||[]).map(s=>`<tr><td>${esc(s.subnet)}</td><td>${esc(s.enabled?'ON':'OFF')}</td>
    <td class="muted">${esc(s.charter_ref||'-')}</td><td><button class="act" onclick="delSubnet('${esc(s.subnet)}')">삭제</button></td></tr>`).join('');
  const credRows=(creds.items||[]).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.username)}</td>
    <td class="muted">${esc(c.password_ref)}</td><td>${esc(c.enabled?'ON':'OFF')}</td></tr>`).join('');
  v.innerHTML=`<h2>관리</h2>
    <div class="card"><h3>대상 Subnet</h3>
      <div class="row"><input id="ns" placeholder="10.20.0.0/24"><input id="nc" placeholder="charter_ref">
      <button class="act" onclick="addSubnet()">추가</button></div>
      <table><tr><th>subnet</th><th>상태</th><th>charter</th><th></th></tr>${subRows||'<tr><td class=muted colspan=4>없음</td></tr>'}</table></div>
    <div class="card"><h3>Credential (password_ref=env: 강제, 평문 저장 금지)</h3>
      <table><tr><th>name</th><th>username</th><th>password_ref</th><th>상태</th></tr>${credRows||'<tr><td class=muted colspan=4>없음</td></tr>'}</table></div>`;
}
async function addSubnet(){ const subnet=$('#ns').value.trim(), charter_ref=$('#nc').value.trim();
  if(!subnet)return; try{ await fetch(api('/api/admin/subnets'),{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({subnet,charter_ref:charter_ref||null})}); }catch(e){ alert('실패: '+e);} render(); }
async function delSubnet(s){ if(!confirm(s+' 삭제?'))return; try{ await fetch(api('/api/admin/subnets',{subnet:s}),{method:'DELETE'});}catch(e){alert(e);} render(); }

function render(){ ({dash:renderDash,findings:renderFindings,report:renderReport,mail:renderMail,admin:renderAdmin}[activeTab]||renderDash)(); }
setInterval(()=>{ const c=$('#clock'); if(c)c.textContent=new Date().toLocaleTimeString('ko-KR'); }, 1000);
setNavActive();
render();
setInterval(()=>{ if(activeTab==='dash') renderDash(); }, 15000);
</script>
</body>
</html>

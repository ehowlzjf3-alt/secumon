apiVersion: v1
kind: ConfigMap
metadata:
  name: secu-agent-runtime
  namespace: secu-agent
  labels:
    app.kubernetes.io/part-of: secu-agent
data:
  PYTHONPATH: /app/engine/src:/app/skill
  SA_ENGINE_DIR: /app/engine
  SA_PLUGINS: /app/skill/plugin/bootstrap.py
  SA_SMB_EVIDENCE_DIR: /var/lib/secu-agent/evidence
  SA_E2E_EVIDENCE_DIR: /var/lib/secu-agent/evidence
  DEFAULT_CHARTER_REF: SECOPS-2026-001

  # ★ 메일 egress 단일 기준: docs/MAIL-EGRESS-POLICY.md (2축·`@도메인` 함정·설정 3곳)
  #   여기는 fail-closed 기본값 — 실발송 활성화는 digisecu-employee/deploy/engine/mail-send-safe.yaml
  SA_DELIVERY_AUTOSEND_SINKS: ""
  SA_DELIVERY_AUTOSEND_CHARTERS: ""
  SA_DELIVERY_RECIPIENT_ALLOW: ""
  SA_DSSOC_MAIL_RECIPIENT: dssoc@samsung.com
  # 수신처 정책 — 4도메인 **전부** 적는다. 키가 없으면 자율발송이 켜진 순간
  # DeliveryPolicyError 로 멈춘다(그게 설계 의도지만, 켜는 사람이 이유를 못 찾는다).
  # `normal` = To=담당자 / Cc=DSSOC. 실발송 여부는 여기서 안 정한다 —
  # 아래 SA_DELIVERY_AUTOSEND_SINKS 가 비어 있어 이 파일 기준은 전부 dry-run 이다.
  SMB_REMEDIATION_MAIL_MODE: normal
  GITHUB_REMEDIATION_MAIL_MODE: normal
  CONFLUENCE_REMEDIATION_MAIL_MODE: normal
  DEV_WEB_REMEDIATION_MAIL_MODE: normal

  SA_SMB_WEB_HOST: 0.0.0.0
  SA_SMB_WEB_PORT: "8767"
  SA_DEV_WEB_HOST: 0.0.0.0
  SA_DEV_WEB_PORT: "8769"
  SA_GITHUB_WEB_HOST: 0.0.0.0
  SA_GITHUB_WEB_PORT: "8770"
  SA_CONFLUENCE_WEB_HOST: 0.0.0.0
  SA_CONFLUENCE_WEB_PORT: "8773"

  COLLECTOR_POLL_SECONDS: "60"
  SMB_TASK_POLL_SEC: "60"
  SMB_REPORT_MAIL_POLL_SECONDS: "60"
  SMB_REPLY_VERIFY_POLL_SECONDS: "60"
  GITHUB_PIPELINE_POLL_SECONDS: "60"
  CONFLUENCE_PIPELINE_POLL_SECONDS: "60"
  DEV_WEB_DISCOVERY_POLL_SECONDS: "300"
  DEV_WEB_TASK_POLL_SECONDS: "60"
  DEV_WEB_REPORT_POLL_SECONDS: "120"
  DEV_WEB_REVERIFY_POLL_SECONDS: "300"

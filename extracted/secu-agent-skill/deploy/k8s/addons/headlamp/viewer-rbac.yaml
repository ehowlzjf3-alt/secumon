apiVersion: v1
kind: ServiceAccount
metadata:
  name: secu-agent-headlamp-viewer
  namespace: secu-agent
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: viewer-rbac
    app.kubernetes.io/part-of: secu-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secu-agent-headlamp-viewer
  namespace: secu-agent
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: viewer-rbac
    app.kubernetes.io/part-of: secu-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secu-agent-headlamp-viewer
  namespace: secu-agent
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: viewer-rbac
    app.kubernetes.io/part-of: secu-agent
subjects:
  - kind: ServiceAccount
    name: secu-agent-headlamp-viewer
    namespace: secu-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secu-agent-headlamp-viewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secu-agent-headlamp-viewer-cluster-view
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: viewer-rbac
    app.kubernetes.io/part-of: secu-agent
subjects:
  - kind: ServiceAccount
    name: secu-agent-headlamp-viewer
    namespace: secu-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secu-agent-headlamp-cluster-metadata-viewer
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: viewer-rbac
    app.kubernetes.io/part-of: secu-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secu-agent-headlamp-cluster-metadata-viewer
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: viewer-rbac
    app.kubernetes.io/part-of: secu-agent
subjects:
  - kind: ServiceAccount
    name: secu-agent-headlamp-viewer
    namespace: secu-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secu-agent-headlamp-cluster-metadata-viewer
---
apiVersion: v1
kind: Secret
metadata:
  name: secu-agent-headlamp-viewer-token
  namespace: secu-agent
  annotations:
    kubernetes.io/service-account.name: secu-agent-headlamp-viewer
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: viewer-rbac
    app.kubernetes.io/part-of: secu-agent
type: kubernetes.io/service-account-token

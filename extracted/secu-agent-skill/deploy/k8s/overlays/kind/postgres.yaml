apiVersion: apps/v1
kind: Deployment
metadata:
  name: secu-agent-postgres
  namespace: secu-agent
  labels:
    app.kubernetes.io/name: secu-agent-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: secu-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secu-agent-postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secu-agent-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: secu-agent
    spec:
      containers:
        - name: postgres
          image: postgres:16-bookworm
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: secu_agent
            - name: POSTGRES_USER
              value: secu_agent
            - name: POSTGRES_PASSWORD
              value: secu_agent
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - secu_agent
                - -d
                - secu_agent
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - secu_agent
                - -d
                - secu_agent
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: secu-agent-postgres
  namespace: secu-agent
  labels:
    app.kubernetes.io/name: secu-agent-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: secu-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: secu-agent-postgres
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

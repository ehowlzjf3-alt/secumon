apiVersion: apps/v1
kind: Deployment
metadata:
  name: secu-agent-github-runner
  namespace: secu-agent
  labels:
    app.kubernetes.io/name: secu-agent-github
    app.kubernetes.io/component: runner
    secu-agent.io/domain: github
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secu-agent-github
      app.kubernetes.io/component: runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secu-agent-github
        app.kubernetes.io/component: runner
        secu-agent.io/domain: github
    spec:
      serviceAccountName: secu-agent-domain
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: secu-agent-skill:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["python", "-m", "domains.services.github.runners.pipeline"]
          envFrom:
            - configMapRef:
                name: secu-agent-runtime
            - secretRef:
                name: secu-agent-runtime
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: evidence
              mountPath: /var/lib/secu-agent/evidence
      volumes:
        - name: evidence
          persistentVolumeClaim:
            claimName: secu-agent-evidence

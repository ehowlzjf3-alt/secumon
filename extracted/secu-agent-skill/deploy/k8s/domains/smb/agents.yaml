apiVersion: apps/v1
kind: Deployment
metadata:
  name: secu-agent-smb-collector
  namespace: secu-agent
  labels:
    app.kubernetes.io/name: secu-agent-smb
    app.kubernetes.io/component: collector
    secu-agent.io/domain: smb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secu-agent-smb
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secu-agent-smb
        app.kubernetes.io/component: collector
        secu-agent.io/domain: smb
    spec:
      serviceAccountName: secu-agent-domain
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: secu-agent-skill:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["python", "-m", "domains.smb.runners.collector"]
          envFrom:
            - configMapRef:
                name: secu-agent-runtime
            - secretRef:
                name: secu-agent-runtime
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: evidence
              mountPath: /var/lib/secu-agent/evidence
      volumes:
        - name: evidence
          persistentVolumeClaim:
            claimName: secu-agent-evidence
---

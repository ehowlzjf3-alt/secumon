apiVersion: apps/v1
kind: Deployment
metadata:
  name: secu-agent-dev-web-discovery
  namespace: secu-agent
  labels:
    app.kubernetes.io/name: secu-agent-dev-web
    app.kubernetes.io/component: discovery
    secu-agent.io/domain: dev-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secu-agent-dev-web
      app.kubernetes.io/component: discovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secu-agent-dev-web
        app.kubernetes.io/component: discovery
        secu-agent.io/domain: dev-web
    spec:
      serviceAccountName: secu-agent-domain
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: discovery
          image: secu-agent-skill:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["python", "-m", "domains.dev_web.runners.discovery"]
          args: ["--loop"]
          envFrom:
            - configMapRef:
                name: secu-agent-runtime
            - secretRef:
                name: secu-agent-runtime
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: evidence
              mountPath: /var/lib/secu-agent/evidence
      volumes:
        - name: evidence
          persistentVolumeClaim:
            claimName: secu-agent-evidence
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secu-agent-dev-web-task
  namespace: secu-agent
  labels:
    app.kubernetes.io/name: secu-agent-dev-web
    app.kubernetes.io/component: task
    secu-agent.io/domain: dev-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secu-agent-dev-web
      app.kubernetes.io/component: task
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secu-agent-dev-web
        app.kubernetes.io/component: task
        secu-agent.io/domain: dev-web
    spec:
      serviceAccountName: secu-agent-domain
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: task
          image: secu-agent-skill:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-lc"]
          args:
            - while true; do python -m domains.dev_web.runners.task; sleep "${DEV_WEB_TASK_POLL_SECONDS:-60}"; done
          envFrom:
            - configMapRef:
                name: secu-agent-runtime
            - secretRef:
                name: secu-agent-runtime
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: evidence
              mountPath: /var/lib/secu-agent/evidence
      volumes:
        - name: evidence
          persistentVolumeClaim:
            claimName: secu-agent-evidence
---

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secu-agent-skill"
version = "0.1.0"
description = "Domain plugin and skill bundles for the secu-agent enterprise security agent"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
smb = [
    "impacket>=0.12",
    "pymupdf>=1.24",
    "pypdf>=5.0",
]
web = [
    "beautifulsoup4>=4.12",
]
all = [
    "beautifulsoup4>=4.12",
    "impacket>=0.12",
    "pymupdf>=1.24",
    "pypdf>=5.0",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# ⚠️ 새 도메인에 tests/ 를 만들면 **여기에 반드시 추가**한다. 빠뜨리면 그 디렉터리의
# 테스트는 조용히 안 돈다(에러가 아니라 침묵). test_testpaths_cover_every_test_dir 가 잡는다.
testpaths = [
    "tests",
    "plugin/tests",
    "_shared/tests",
    "domains/dev_web/tests",
    "domains/smb/tests",
    "domains/web/tests",
    "domains/services/tests",
    "service/tests",
]
pythonpath = ["."]

# ⚠️⚠️ 타임아웃이 없으면 **멈춘 테스트 하나가 스위트를 영원히 멈춘다.**
# 2026-08-30 에 세 번 겪었다 — 1시간 22분 · 5시간 · 14시간 동안 "도는 중" 인 줄 알았다.
# 원인은 매번 테스트가 실 네트워크(SSO 브라우저·MCP)를 탄 것이었고, 멈춤은 실패로
# 보고되지 않으니 CI 도 사람도 못 잡는다.
#
# `thread` 방식은 멈춘 지점의 **스택을 덤프**한다 — 어느 테스트가 어디서 멈췄는지
# 그 자리에서 나온다(이 값 덕분에 test_github_owner 의 브라우저 누출을 3분 만에 찾았다).
# 300초는 이 저장소에서 가장 느린 테스트(실측 121초/291건 스위트)보다 넉넉하다.
timeout = 300
timeout_method = "thread"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "_shared*",
    "dev_webapp*",
    "domains*",
    "engine_extracts*",
    "plugin*",
    "service*",
    "tools*",
    "webapp*",
]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.html", "*.json", "*.md", "*.txt", "*.yaml", "*.yml"]

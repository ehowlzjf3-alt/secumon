# ============================================================
# M5 안전-발송 활성화 config — 실발송을 켜되 수신자를 dssoc + shaneee.baek 로만 잠금.
# ============================================================
# ★ 단일 기준: secu-agent-skill/docs/MAIL-EGRESS-POLICY.md
#   값을 바꿀 땐 거기부터 고치고 설정 3곳(skill/.env · skill deploy/k8s/base/runtime-configmap.yaml
#   · 이 파일)을 맞춘다. ⚠️ RECIPIENT_ALLOW 에 `@도메인` 을 넣으면 그 도메인 전체가 열린다
#   (코어 `_recipient_allowed` 가 suffix 매칭 — 2026-08-15 에 skill/.env 가 그 상태였다).
# 【무엇】 엔진의 발송 게이트는 2축·전역(네임스페이스 ConfigMap)이다:
#   (축1 수신자) <도메인>_REMEDIATION_MAIL_MODE: normal=To=owner/Cc=DSSOC.
#     ⚠️ `dssoc_only` 는 **폐기됐다**(2026-08-24). 자율발송이 켜졌는데 normal 이 아니면
#     예외로 멈춘다 — 실발송 중에 DSSOC 에게만 보내면 담당자가 통보를 못 받고
#     화면엔 통보 완료로 남기 때문이다. 4도메인(SMB/GITHUB/CONFLUENCE/DEV_WEB) 전부 필요.
#   (축2 egress) SA_DELIVERY_* 4조건 fail-closed: sink opt-in + charter(설정 시) + RECIPIENT_ALLOW 전원매칭 + redact scan clean
# 아래 값은 mode=normal 이지만 **RECIPIENT_ALLOW 를 dssoc + shaneee.baek 정확 주소로만** 열어,
# owner 가 shaneee.baek@samsung.com 로 해석될 때만 실발송되고 그 외 실 자산소유자에겐 전부 dry-run(차단)이다.
#
# ★★ 지금 실 담당자에게 메일이 안 나가는 이유는 **드라이런이 아니라 이 화이트리스트 2개**다.
#    `SA_DELIVERY_AUTOSEND_SINKS` 는 이미 켜져 있다(로컬 `.env` 포함). RECIPIENT_ALLOW 를
#    넓히는 순간 **그날부터 실 담당자에게 나간다.** 여기에 `@samsung.com` 같은 도메인 항목을
#    넣으면 코어가 suffix 매칭하므로 전사가 한 번에 열린다(MAIL-EGRESS-POLICY.md 참조).
#
# ⚠️ 예외 하나: mail_thread #21(`codex/pop3-inbox-test-…`)은 담당자가 shaneee.baek 라
#    화이트리스트를 **통과한다**. 현재 주차(W35) 큐엔 안 잡히지만, 전체 주차로 돌리면 나간다.
#
# 【digisecu 승인 게이트와의 관계】 control-plane 의 enable_send 승인은 임직원별 mail_send_mode(거버넌스 intent)만
# per_owner 로 바꾼다(감사 남김). 실 egress 는 이 ConfigMap 이 별도로 fail-closed 강제한다 — 두 게이트 모두 열려야 실발송.
#
# 【사용자 준비 — 자격증명은 Claude 가 안 봄】
#   1) Knox Mail MCP 접속 URL 과 실 메일 계정은 사용자가 Secret 으로 생성:
#      kubectl -n <ns> create secret generic engine-mail-creds \
#        --from-literal=SA_KNOX_MAIL_MCP_URL='<knox mcp url>' \
#        --from-literal=MAIL_SENDER_EMAIL='<발신자>' --from-literal=POP3_USER='<...>' --from-literal=POP3_PASSWORD='<...>'
#   2) 아래 ConfigMap 적용 후 report-mail 에이전트 파드가 envFrom 으로 둘 다 주입받게 한다.
#   3) 실발송 트리거(엔진 report_mail_agent 가속) 는 사용자 확인 하에. allowlist 밖 주소는 자동 dry-run.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secu-agent-mail-safe
  labels: { app.kubernetes.io/managed-by: digisecu, digisecu.local/purpose: mail-send-safe }
data:
  # 축1: 수신자 정책 — owner 로(단, allowlist 가 실제 수신자를 dssoc+shaneee.baek 로 제한).
  # ⚠️⚠️ **4도메인을 전부 적어야 한다.** 이 파일은 자율발송을 켜는 파일인데,
  #   키가 없는 도메인은 `DeliveryPolicyError` 로 **배달이 멈춘다**(설계 의도).
  #   예전엔 SMB 하나뿐이라, 이 파일을 적용하면 나머지 셋이 조용히 죽었다.
  SMB_REMEDIATION_MAIL_MODE: "normal"
  GITHUB_REMEDIATION_MAIL_MODE: "normal"
  CONFLUENCE_REMEDIATION_MAIL_MODE: "normal"
  DEV_WEB_REMEDIATION_MAIL_MODE: "normal"
  SMB_REMEDIATION_DSSOC_RECIPIENT: "dssoc@samsung.com"
  SA_DSSOC_MAIL_RECIPIENT: "dssoc@samsung.com"
  # 축2: egress 자동발송 opt-in. sink=knox_mail, 수신 허용목록=정확히 두 주소만(실 owner 도메인 미포함=차단).
  SA_DELIVERY_AUTOSEND_SINKS: "knox_mail"
  SA_DELIVERY_RECIPIENT_ALLOW: "dssoc@samsung.com,shaneee.baek@samsung.com"
  # charter 게이트는 설정 시에만 강제 — 운영 정합 전까지 비워 조건부 스킵(③④가 실질 하드가드).
  SA_DELIVERY_AUTOSEND_CHARTERS: ""
  # SA_KNOX_MAIL_MCP_URL 은 Secret(engine-mail-creds)로 주입 — 미설정 시 OwnerMailError 로 fail-closed.
